version: "3.8"

services:
  aeo-system:
    build: .
    container_name: aeo-system
    restart: unless-stopped
    ports:
      - "${PORT:-3080}:3080"
    environment:
      - PORT=3080
      - ADMIN_USERNAME=${ADMIN_USERNAME:-aeo}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-aeo2026}
      - API_KEY=${API_KEY:-}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3080}
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    volumes:
      - aeo-data:/app/data
      - aeo-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aeo-data:
    name: aeo-system-data
  aeo-uploads:
    name: aeo-system-uploads
