# ========================================================================
# AEO海关认证管理系统 — Nginx 反向代理配置
# 用于生产环境：HTTPS 终结、速率限制、安全头、日志
# ========================================================================
# 使用方法：
#   1. 将 SSL 证书放置于 /etc/nginx/ssl/
#   2. 检查 server_name 和 proxy_pass 地址
#   3. sudo ln -s /path/to/nginx-aeo.conf /etc/nginx/conf.d/aeo.conf
#   4. sudo nginx -t && sudo systemctl reload nginx
# ========================================================================

upstream aeo_backend {
    server 127.0.0.1:3080;
    keepalive 32;
}

# ── HTTP → HTTPS 强制跳转 ────────────────────────────
server {
    listen 80;
    server_name aeo.yourcompany.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS 服务器 ──────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name aeo.yourcompany.com;

    # ── SSL 证书（请替换为实际路径） ────────────────
    ssl_certificate     /etc/nginx/ssl/aeo.crt;
    ssl_certificate_key /etc/nginx/ssl/aeo.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 速率限制区域 ──────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ── 文件上传大小 ──────────────────────────────────
    client_max_body_size 100M;
    proxy_request_buffering off;
    proxy_buffering off;

    # ── 安全头（增强，在 Nginx 层加倍保障） ──────────
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:*; frame-ancestors 'none'" always;

    # ── 结构化访问日志 ────────────────────────────────
    log_format aeo_json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status"'
    '}';
    access_log /var/log/nginx/aeo-access.log aeo_json;
    error_log  /var/log/nginx/aeo-error.log warn;

    # ── 静态资源（直接由 Nginx 处理，不转发到 Node） ──
    location / {
        proxy_pass http://aeo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── 登录接口（严格速率限制） ──────────────────────
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://aeo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── 通用 API（连接数限制） ────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://aeo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── 健康检查（不记录访问日志） ──────────────────
    location /api/health {
        access_log off;
        proxy_pass http://aeo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── 阻止访问敏感路径 ──────────────────────────────
    location ~ /\.git {
        deny all;
        return 404;
    }
    location ~ /(\.env|data/|node_modules) {
        deny all;
        return 404;
    }
}
